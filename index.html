<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport: keep your settings, add shrink-to-fit + keyboard overlay hint -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no, interactive-widget=overlays-content"
    />

    <title>Lightweight Agency | Websites, Stores, AI Automation & Marketing</title>
    <meta
      name="description"
      content="Lightweight Agency builds high-converting websites and stores, AI-powered automation tools, and full-funnel marketing that grows revenue fast."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://lightweight.agency/" />

    <!-- App/brand basics -->
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Flightweight-profile-pic-size-2.png?alt=media&token=4e6b4c27-2018-4c43-aff6-969464704c83" type="image/svg+xml" />
    <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Flightweight-profile-pic-size-2.png?alt=media&token=4e6b4c27-2018-4c43-aff6-969464704c83" sizes="any" />
    <link rel="apple-touch-icon" href="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Flightweight-profile-pic-size-2.png?alt=media&token=4e6b4c27-2018-4c43-aff6-969464704c83" />
    <link rel="mask-icon" href="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Flightweight-profile-pic-size-2.png?alt=media&token=4e6b4c27-2018-4c43-aff6-969464704c83" color="#111827" />

    <!-- Preconnects and fonts (display swap for CLS-safe rendering) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@100;200;300;400;500;600;700;800;900&family=Sacramento&display=swap"
      rel="stylesheet"
    />

    <!-- (Optional) Preload critical brand assets for faster LCP -->
    <!-- <link rel="preload" as="image" href="/images/hero@2x.jpg" imagesrcset="/images/hero.jpg 1x, /images/hero@2x.jpg 2x" fetchpriority="high" /> -->
    <!-- <link rel="preload" as="image" href="/logo.png" /> -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lightweight Agency" />
    <meta property="og:title" content="Lightweight Agency | Websites, Stores, AI Automation & Marketing" />
    <meta property="og:description" content="Custom websites and stores, AI-powered automation, and creative that converts." />
    <meta property="og:url" content="https://lightweight.agency/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Ffor-seo.png?alt=media&token=784f7c91-171a-4a7e-a3f9-422f2f58c205" />
    <meta property="og:image:alt" content="Lightweight Agency — Creative, Fast, Effective" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lightweight Agency | Websites, Stores, AI Automation & Marketing" />
    <meta name="twitter:description" content="Custom websites and stores, AI-powered automation, and creative that converts." />
    <meta name="twitter:image" content="https://firebasestorage.googleapis.com/v0/b/stone-baked-pizza-client.firebasestorage.app/o/media%2Flightweight%2Ffor-seo.png?alt=media&token=784f7c91-171a-4a7e-a3f9-422f2f58c205" />

    <!-- Structured Data: WebSite + Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Lightweight Agency",
            "url": "https://lightweight.agency/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://lightweight.agency/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "Lightweight Agency",
            "url": "https://lightweight.agency/",
            "logo": "https://lightweight.agency/logo.png"
          }
        ]
      }
    </script>

    <!-- Performance hints for SPA boot -->
    <link rel="modulepreload" href="/src/main.jsx" />

    <!-- Mobile scaling & overflow fixes -->
    <style>
      /* Consistent sizing and no accidental horizontal scroll */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      html, body { width: 100%; overflow-x: hidden; }

      /* Prevent iOS Safari from auto-zooming text and inputs */
      body { margin: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      input, select, textarea { font-size: 16px; } /* avoids iOS zoom on focus */

      /* Media scale safely on small screens */
      img, svg, video, canvas, iframe { display: block; max-width: 100%; height: auto; }

      /* Optional utility: use dynamic viewport height for mobile (safe vs 100vh) */
      .min-h-100dvh { min-height: 100dvh; }
    </style>
  </head>

  <body>
    <noscript>
      <strong>Lightweight Agency</strong> requires JavaScript to run. Please enable it to view our site.
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
